# Development hot-reload untuk backend Go (macOS / Linux).
# Jalankan lewat: npm run dev  |  ./scripts/dev.sh
# GOCACHE diset oleh scripts/dev.mjs agar cache build di .tmp/go-cache (lintas OS).

root = "."
tmp_dir = ".tmp/air"

[build]
  cmd = "go build -o ./.tmp/air/wa-assistant ./backend"
  entrypoint = ["./.tmp/air/wa-assistant"]
  include_dir = ["backend"]
  include_ext = ["go"]
  include_file = ["go.mod", "go.sum", ".env"]
  exclude_dir = ["frontend", ".git", ".tmp", "data", "dist"]
  exclude_regex = ["_test.go"]
  delay = 500
  # Gunakan kill langsung saat hot-reload. Proses Go melakukan graceful
  # shutdown sendiri saat aplikasi dihentikan dari launcher, sedangkan SIGINT
  # dari Air dapat menyisakan binary lama tetap memegang port 3030.
  kill_delay = "500ms"
  send_interrupt = false
  stop_on_error = false
  log = "build-errors.log"

[log]
  time = true

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
