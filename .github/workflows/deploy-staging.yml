name: Deploy Staging

on:
  push:
    branches:
      - develop

workflow_dispatch:

concurrency:
  group: ruangkirim-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Tencent VPS Staging
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            echo "=============================================="
            echo "RUANGKIRIM STAGING DEPLOY"
            echo "=============================================="

            cd /var/www/ruangkirim-staging

            echo "=== FETCH LATEST CODE ==="
            git fetch origin develop

            echo "=== SYNC TO ORIGIN/DEVELOP ==="
            git checkout develop
            git reset --hard origin/develop

            echo "=== DOWNLOAD GO DEPENDENCIES ==="
            go mod download

            echo "=== BUILD BACKEND ==="
            go build -o ruangkirim-staging-server ./backend

            echo "=== RESTART SERVICE ==="
            sudo systemctl restart ruangkirim-staging.service

            echo "=== VERIFY SERVICE ==="
            sudo systemctl is-active --quiet ruangkirim-staging.service

            echo "=== DEPLOY COMPLETE ==="
