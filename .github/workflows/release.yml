name: Package Member Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install zip utility
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Package member release
        run: node scripts/pack-master.mjs

      - name: Upload Artifact (Downloadable from GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: chatloop-member-zip
          path: dist/chatloop-member.zip

      - name: Create GitHub Release (if tag pushed)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/chatloop-member.zip
          generate_release_notes: true
